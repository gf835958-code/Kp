<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Gold Tap - Telegram Mini Game</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-info {
            font-size: 0.85rem;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }
        .lang-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .score-board {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-top: 10px;
        }
        .score-board h1 {
            font-size: 2.5rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .score-board p {
            font-size: 0.85rem;
            color: #b3b3b3;
            letter-spacing: 1px;
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-grow: 1;
        }
        .tap-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffcc 0%, #0077b6 100%);
            border: 5px solid #ffffff;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: transform 0.1s ease;
            user-select: none;
        }
        .tap-button:active {
            transform: scale(0.92);
        }
        .floating-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff007f;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
        .footer-nav {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
            text-align: center;
            font-size: 0.9rem;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.25); }

        /* Modal Box Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: #1a1a2e;
            border: 1px solid #00ffcc;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: #ff007f;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .item-card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .buy-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .payment-option {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            border: 1px dashed #00ffcc;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="player-info" id="playerNameDisplay">👤 Loading...</div>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">🇲🇲 MM</button>
    </div>

    <div class="score-board">
        <p id="label-score">TOTAL GOLD</p>
        <h1 id="score">0</h1>
    </div>

    <div class="game-area" id="gameArea">
        <div class="tap-button" id="tapBtn">🪙</div>
    </div>

    <div class="footer-nav">
        <button class="nav-btn" onclick="openModal('shopModal')" id="btn-shop">🛍️ Shop</button>
        <button class="nav-btn" onclick="openModal('topupModal')" id="btn-topup">💳 Top-Up</button>
        <button class="nav-btn" onclick="resetScore()" id="btn-reset">🔄 Reset</button>
    </div>

    <!-- Shop Modal -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="shop-title">🛍️ Upgrades Shop</h3>
                <button class="close-btn" onclick="closeModal('shopModal')">&times;</button>
            </div>
            <div class="item-card">
                <div>
                    <h4 id="item1-title">⚡ Double Tap (+2)</h4>
                    <small id="item1-desc">Tap တစ်ချက်နှိပ်ရင် 2 မှတ်ရမည်</small>
                </div>
                <button class="buy-btn" onclick="buyDoubleTap()" id="buy1-btn">100 Gold</button>
            </div>
            <div class="item-card">
                <div>
                    <h4 id="item2-title">🤖 Auto Miner</h4>
                    <small id="item2-desc">1 စက္ကန့်လျှင် 1 Gold အလိုအလျောက်ရမည်</small>
                </div>
                <button class="buy-btn" onclick="buyAutoMiner()" id="buy2-btn">500 Gold</button>
            </div>
        </div>
    </div>

    <!-- Top-Up Modal (Myanmar Payments) -->
    <div class="modal" id="topupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="topup-title">💳 Local Top-Up</h3>
                <button class="close-btn" onclick="closeModal('topupModal')">&times;</button>
            </div>
            <p style="font-size: 0.85rem; color: #ccc;" id="topup-desc">KBZPay သို့မဟုတ် WavePay ဖြင့် Gold ဝယ်ယူနိုင်ပါသည်။</p>
            
            <div class="payment-option">
                <p><strong>KBZPay / WavePay</strong></p>
                <p style="color: #00ffcc; font-size: 1.1rem; margin: 5px 0;">09-XXXXXXXXX</p>
                <small id="kpay-note">1,000 MMK = 10,000 Gold</small>
            </div>

            <div style="margin-top: 15px;">
                <input type="text" id="txId" placeholder="Transaction ID (နောက်ဆုံး ၆ လုံး)" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 10px; background: #222; color: #fff;">
                <button class="buy-btn" style="width: 100%; padding: 10px;" onclick="submitTopup()" id="btn-submit-topup">Submit Verification</button>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp Integration
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const playerName = user ? `${user.first_name}` : "Player";
        const playerId = user ? user.id : "GUEST_" + Math.floor(Math.random() * 100000);

        document.getElementById('playerNameDisplay').textContent = `👤 ${playerName}`;

        // Game State Variables
        let score = parseInt(localStorage.getItem('kp_game_score_' + playerId)) || 0;
        let tapPower = parseInt(localStorage.getItem('kp_tap_power_' + playerId)) || 1;
        let autoMinerCount = parseInt(localStorage.getItem('kp_auto_miner_' + playerId)) || 0;
        let currentLang = localStorage.getItem('kp_lang') || 'MM';

        const scoreElement = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');

        // Language Dictionary
        const langData = {
            MM: {
                labelScore: "စုစုပေါင်း ရမှတ်",
                btnShop: "🛍️ ဆိုင်ခန်း",
                btnTopup: "💳 ငွေဖြည့်မည်",
                btnReset: "🔄 ပြန်စမည်",
                shopTitle: "🛍️ အဆင့်မြှင့်တင်ရန်",
                item1Title: "⚡ နှစ်ဆ ရမှတ် (+2)",
                item1Desc: "Tap တစ်ချက်နှိပ်လျှင် +2 ရမည်",
                item2Title: "🤖 အလိုအလျောက် ရမှတ်",
                item2Desc: "1 စက္ကန့်လျှင် +1 Gold ရမည်",
                topupTitle: "💳 မြန်မာငွေဖြင့် Gold ဖြည့်မည်",
                topupDesc: "KBZPay သို့မဟုတ် WavePay ဖြင့် Gold ဝယ်ယူနိုင်ပါသည်။",
                kpayNote: "1,000 ကျပ် = 10,000 Gold",
                btnSubmitTopup: "အတည်ပြုမည်"
            },
            EN: {
                labelScore: "TOTAL GOLD",
                btnShop: "🛍️ Shop",
                btnTopup: "💳 Top-Up",
                btnReset: "🔄 Reset",
                shopTitle: "🛍️ Upgrades Shop",
                item1Title: "⚡ Double Tap (+2)",
                item1Desc: "Get +2 Gold per tap",
                item2Title: "🤖 Auto Miner",
                item2Desc: "Get +1 Gold per second",
                topupTitle: "💳 Local Payment Top-Up",
                topupDesc: "Top-up Gold using KBZPay or WavePay.",
                kpayNote: "1,000 MMK = 10,000 Gold",
                btnSubmitTopup: "Submit Verification"
            }
        };

        updateScoreDisplay();
        applyLanguage();

        // Auto Miner Loop
        setInterval(() => {
            if (autoMinerCount > 0) {
                score += autoMinerCount;
                updateScoreDisplay();
            }
        }, 1000);

        // Tap Event
        tapBtn.addEventListener('pointerdown', (e) => {
            score += tapPower;
            updateScoreDisplay();
            createFloatingText(e.clientX, e.clientY, `+${tapPower}`);
            
            // Telegram Haptic Feedback (ဖုန်းတုန်ခါမှု အကျိုးအသက်ရောက်မှု)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        function updateScoreDisplay() {
            scoreElement.textContent = score;
            localStorage.setItem('kp_game_score_' + playerId, score);
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 40) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Shop System Logic
        function buyDoubleTap() {
            if (score >= 100) {
                score -= 100;
                tapPower = 2;
                localStorage.setItem('kp_tap_power_' + playerId, tapPower);
                updateScoreDisplay();
                alert("🎉 Double Tap Unlocked!");
            } else {
                alert("❌ Gold မလုံလောက်ပါ။");
            }
        }

        function buyAutoMiner() {
            if (score >= 500) {
                score -= 500;
                autoMinerCount += 1;
                localStorage.setItem('kp_auto_miner_' + playerId, autoMinerCount);
                updateScoreDisplay();
                alert("🎉 Auto Miner Unlocked!");
            } else {
                alert("❌ Gold မလုံလောက်ပါ။");
            }
        }

        // Top-Up Logic (Simulation / Ready for Telegram Bot Hook)
        function submitTopup() {
            const txId = document.getElementById('txId').value.trim();
            if (txId.length >= 6) {
                score += 10000; 
                updateScoreDisplay();
                alert("✅ Transaction အတည်ပြုပြီးပါပြီ! Gold +10,000 ထည့်သွင်းပေးလိုက်ပါပြီ။");
                document.getElementById('txId').value = '';
                closeModal('topupModal');
            } else {
                alert("⚠️ Transaction ID မှန်ကန်စွာ ထည့်သွင်းပါ (အနည်းဆုံး ၆ လုံး)။");
            }
        }

        // Modal Handlers
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Language Switcher
        function toggleLanguage() {
            currentLang = currentLang === 'MM' ? 'EN' : 'MM';
            localStorage.setItem('kp_lang', currentLang);
            document.getElementById('lang-btn').textContent = currentLang === 'MM' ? '🇲🇲 MM' : '🇬🇧 EN';
            applyLanguage();
        }

        function applyLanguage() {
            const lang = langData[currentLang];
            document.getElementById('label-score').textContent = lang.labelScore;
            document.getElementById('btn-shop').textContent = lang.btnShop;
            document.getElementById('btn-topup').textContent = lang.btnTopup;
            document.getElementById('btn-reset').textContent = lang.btnReset;
            document.getElementById('shop-title').textContent = lang.shopTitle;
            document.getElementById('item1-title').textContent = lang.item1Title;
            document.getElementById('item1-desc').textContent = lang.item1Desc;
            document.getElementById('item2-title').textContent = lang.item2Title;
            document.getElementById('item2-desc').textContent = lang.item2Desc;
            document.getElementById('topup-title').textContent = lang.topupTitle;
            document.getElementById('topup-desc').textContent = lang.topupDesc;
            document.getElementById('kpay-note').textContent = lang.kpayNote;
            document.getElementById('btn-submit-topup').textContent = lang.btnSubmitTopup;
        }

        function resetScore() {
            if (confirm("ရမှတ်များကို 0 သို့ ပြန်ပြောင်းမည်မှာ သေချာပါသလား?")) {
                score = 0;
                tapPower = 1;
                autoMinerCount = 0;
                localStorage.clear();
                updateScoreDisplay();
            }
        }
    </script>
</body>
</html>
