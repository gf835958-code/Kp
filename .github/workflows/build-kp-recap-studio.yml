name: Build KP Recap Studio Native Android APK
on:
  push:
    branches:
      - app/kp-recap-studio-android
    paths:
      - 'kp-recap-studio/**'
      - '.github/workflows/build-kp-recap-studio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kp-recap-studio/**'
      - '.github/workflows/build-kp-recap-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: kp-recap-studio
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KP-Recap-Studio-v0.3-debug-APK
          path: kp-recap-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
