name: Build KP Movie Recap APK
on:
  push:
    branches: [kp-movie-recap-app]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform and build tools
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMGR"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Fetch and verify noncommercial Burmese voice engine and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets/mya
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            -o app/libs/sherpa-onnx-2.0.1.aar
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar' | sha256sum -c -
          base=https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/d0f3eabab69a178ad836f5689044998909c88ae7/mya
          curl --fail --location --retry 3 --silent --show-error \
            "$base/model.onnx" -o app/src/main/assets/mya/model.onnx
          echo '9cc2be621aa70461da190cf9a050e8194a46257012ef7c421ae67d57742fb519  app/src/main/assets/mya/model.onnx' | sha256sum -c -
          curl --fail --location --retry 3 --silent --show-error \
            "$base/tokens.txt" -o app/src/main/assets/mya/tokens.txt
          test -s app/src/main/assets/mya/tokens.txt
      - name: Verify native one-click pipeline (30-minute simulation)
        run: node tools/verify-oneclick.cjs
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KP-Movie-Recap-v0.9-EXPERIMENTAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
