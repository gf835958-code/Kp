name: Build KP Movie Recap APK
on:
  push:
    branches: [kp-movie-recap-app]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform and build tools
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMGR"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify native one-click pipeline (30-minute simulation)
        run: node tools/verify-oneclick.cjs
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KP-Movie-Recap-v0.7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
