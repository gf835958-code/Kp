name: Android emulator validation - Burmese narration MP4
on:
  push:
    branches: [kp-movie-recap-app]
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/java/com/kp/movierecap/MainActivity.java'
      - 'tools/run-android-emulator-smoke.sh'
      - 'app/src/main/java/com/kp/movierecap/NativeSceneScanner.java'
      - 'app/src/main/java/com/kp/movierecap/CaptionedVideoExporter.java'
      - 'app/src/main/java/com/kp/movierecap/MovieAudioSampler.java'
      - 'app/src/main/java/com/kp/movierecap/DialogueTranscriber.java'
      - 'app/src/main/java/com/kp/movierecap/BurmeseNarration.java'
      - 'app/src/main/java/com/kp/movierecap/MovieExportPreflight.java'
      - 'app/src/main/java/com/kp/movierecap/MovieSubtitleExtractor.java'
      - 'tools/fetch-asr-model.sh'
      - '.github/workflows/android-emulator-voice-test.yml'
  workflow_dispatch:

concurrency:
  group: android-movie-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get verified Burmese TTS model and Android engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets/mya app/src/androidTest/assets
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            -o app/libs/sherpa-onnx-2.0.1.aar
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar' | sha256sum -c -
          unzip -l app/libs/sherpa-onnx-2.0.1.aar | grep -E 'jni/x86_64/libsherpa-onnx-jni.so$'
          base=https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/d0f3eabab69a178ad836f5689044998909c88ae7/mya
          curl --fail --location --retry 3 --silent --show-error "$base/model.onnx" -o app/src/main/assets/mya/model.onnx
          echo '9cc2be621aa70461da190cf9a050e8194a46257012ef7c421ae67d57742fb519  app/src/main/assets/mya/model.onnx' | sha256sum -c -
          curl --fail --location --retry 3 --silent --show-error "$base/tokens.txt" -o app/src/main/assets/mya/tokens.txt
          test -s app/src/main/assets/mya/tokens.txt
      - name: Fetch offline multilingual Whisper ASR assets
        run: bash tools/fetch-asr-model.sh
      - name: Install ffmpeg for deterministic video fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Generate original 12-second narrated movie MP4 fixture for emulator
        run: |
          espeak-ng -v en-us -s 130 -w app/src/androidTest/assets/kp-dialogue.wav \
            'The secret map is inside the red house. We must find the map.'
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=128x72:r=2 \
            -i app/src/androidTest/assets/kp-dialogue.wav -t 12 \
            -c:v libx264 -pix_fmt yuv420p -r 2 -g 2 -crf 42 \
            -c:a aac -ar 16000 -af apad -movflags +faststart \
            app/src/androidTest/assets/kp-smoke.mp4
          test -s app/src/androidTest/assets/kp-smoke.mp4
          # Original Burmese text cues muxed into an MP4 timed-text track.
          cat > app/src/androidTest/assets/kp-subtitle.srt <<'SUB'
          1
          00:00:02,000 --> 00:00:05,000
          မင်္ဂလာပါ။

          2
          00:00:06,000 --> 00:00:10,000
          မြေပုံကို ရှာဖွေနေသည်။
          SUB
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=blue:s=128x72:r=2 \
            -i app/src/androidTest/assets/kp-subtitle.srt -t 12 \
            -c:v libx264 -pix_fmt yuv420p -r 2 -g 2 -crf 42 \
            -c:s mov_text -movflags +faststart \
            app/src/androidTest/assets/kp-subtitle.mp4
          test -s app/src/androidTest/assets/kp-subtitle.mp4
          # A true silent AAC soundtrack, not a no-audio movie.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=128x72:r=2 \
            -f lavfi -i anullsrc=channel_layout=mono:sample_rate=16000 \
            -t 12 -shortest -c:v libx264 -pix_fmt yuv420p -r 2 -g 2 -crf 43 \
            -c:a aac -b:a 24k -movflags +faststart \
            app/src/androidTest/assets/kp-silence.mp4
          test -s app/src/androidTest/assets/kp-silence.mp4
          # 30-minute movie fixture is generated on GitHub, not on the user's data plan.
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=128x72:r=1 \
            -t 1802 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -r 1 -g 1 \
            -crf 43 -an -movflags +faststart app/src/androidTest/assets/kp-long.mp4
          test -s app/src/androidTest/assets/kp-long.mp4
      - name: Build Android app and test app (emulator ABI)
        run: gradle --no-daemon --stacktrace -PemulatorTest=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run real Android runtime test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/run-android-emulator-smoke.sh
      - name: Verify real output codecs and nonempty audio
        run: |
          test -s kp-emulator-narrated-proof.mp4
          test -s kp-emulator-burmese-proof.wav
          test "$(wc -c < kp-emulator-burmese-proof.wav)" -gt 10000
          head -c 4 kp-emulator-burmese-proof.wav | grep -q RIFF
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 kp-emulator-burmese-proof.wav | grep -q codec_name=pcm_s16le
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 kp-emulator-narrated-proof.mp4 | grep -q codec_name=
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 kp-emulator-narrated-proof.mp4 | grep -q codec_name=
          ffmpeg -hide_banner -loglevel error -i kp-emulator-narrated-proof.mp4 \
            -f null - 2>&1
      - name: Preserve real Android screen and output evidence even if UI validation fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KP-Emulator-Burmese-Voice-Caption-Proof
          path: |
            kp-emulator-narrated-proof.mp4
            kp-emulator-burmese-proof.wav
            kp-friendly-ui-screen.png
            kp-webview-render.png
          retention-days: 7

