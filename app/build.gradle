plugins {
    id 'com.android.application'
}
android {
    namespace 'com.kp.movierecap'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kp.movierecap'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
