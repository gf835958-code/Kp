plugins { id 'com.android.application' }

android {
    namespace 'com.kp.recapstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kp.recapstudio'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device text extraction for text-based PDFs, not scanned-image OCR.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
